# Serve a interface de gerenciamento sob /rabbitmq, o caminho público do gateway.
management.path_prefix = /rabbitmq

# Estatísticas das filas a cada 1 s (o padrão é 5 s), para a aplicação web e a interface de
# gerenciamento mostrarem a fila enchendo e esvaziando quase em tempo real.
collect_statistics_interval = 1000
