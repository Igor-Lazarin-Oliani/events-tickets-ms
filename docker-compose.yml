name: events-tickets-ms

services:
  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      # Aplicação web estática, publicada em /app/.
      - ./frontend:/usr/share/nginx/app:ro
    # Sem depender do logs-service: com ele fora do ar, a venda segue pelo gateway, e só as rotas
    # dele respondem 503. O NGINX resolve os nomes a cada requisição, então o encontra quando subir.
    depends_on:
      events-service:
        condition: service_healthy
      tickets-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - events-tickets-network

  events-db:
    image: postgres:16-alpine
    container_name: events-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: events_user
      POSTGRES_PASSWORD: events_pass
    volumes:
      - events_pgdata:/var/lib/postgresql/data
    healthcheck:
      # O "-h localhost" ignora o servidor temporário usado na inicialização da imagem.
      test: ["CMD-SHELL", "pg_isready -h localhost -U events_user -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - events-tickets-network

  tickets-db:
    image: postgres:16-alpine
    container_name: tickets-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets_db
      POSTGRES_USER: tickets_user
      POSTGRES_PASSWORD: tickets_pass
    volumes:
      - tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      # O "-h localhost" ignora o servidor temporário usado na inicialização da imagem.
      test: ["CMD-SHELL", "pg_isready -h localhost -U tickets_user -d tickets_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - events-tickets-network

  logs-db:
    image: postgres:16-alpine
    container_name: logs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logs_db
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_pass
    volumes:
      - logs_pgdata:/var/lib/postgresql/data
    healthcheck:
      # O "-h localhost" ignora o servidor temporário usado na inicialização da imagem.
      test: ["CMD-SHELL", "pg_isready -h localhost -U logs_user -d logs_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - events-tickets-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    # O RabbitMQ guarda os dados por nome do nó, que depende do hostname.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: events_tickets
      RABBITMQ_DEFAULT_PASS: events_tickets_pass
    volumes:
      - ./messaging/rabbitmq.conf:/etc/rabbitmq/conf.d/20-management-path.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - events-tickets-network

  events-service:
    build: ./microservices/events-service
    container_name: events-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://events_user:events_pass@events-db:5432/events_db
      RABBITMQ_URL: amqp://events_tickets:events_tickets_pass@rabbitmq:5672/%2F
      PORT: "3001"
      SERVICE_NAME: events-service
      LOGS_SERVICE_URL: http://logs-service:8000
      LOGS_SERVICE_TIMEOUT_MS: "3000"
    # Não depende do tickets-service nem do logs-service: eventos e reservas funcionam sem eles.
    depends_on:
      events-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - events-tickets-network

  tickets-service:
    build: ./microservices/tickets-service
    container_name: tickets-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tickets_user:tickets_pass@tickets-db:5432/tickets_db
      RABBITMQ_URL: amqp://events_tickets:events_tickets_pass@rabbitmq:5672/%2F
      PORT: "3002"
      SERVICE_NAME: tickets-service
      EVENTS_SERVICE_URL: http://events-service:3001
      EVENTS_SERVICE_TIMEOUT_MS: "3000"
      LOGS_SERVICE_URL: http://logs-service:8000
      LOGS_SERVICE_TIMEOUT_MS: "3000"
    # Não depende do events-service para subir: consultas, check-in e cancelamentos funcionam sem
    # ele, e só a emissão responde 503 enquanto ele estiver fora do ar (D30).
    depends_on:
      tickets-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - events-tickets-network

  logs-service:
    build: ./microservices/logs-service
    container_name: logs-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://logs_user:logs_pass@logs-db:5432/logs_db
      RABBITMQ_URL: amqp://events_tickets:events_tickets_pass@rabbitmq:5672/%2F
      PORT: "8000"
      SERVICE_NAME: logs-service
    depends_on:
      logs-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # A imagem python:3.11-slim não inclui curl.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - events-tickets-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Serve o Prometheus sob /prometheus, o caminho público do gateway.
      - --web.external-url=http://localhost:8080/prometheus/
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Também sem depender do logs-service: a telemetria precisa subir justamente para mostrar um
    # serviço fora do ar (up = 0).
    depends_on:
      events-service:
        condition: service_healthy
      tickets-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/prometheus/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - events-tickets-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      # Serve o Grafana sob /grafana, o caminho público do gateway.
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Quem abre o painel na demonstração não precisa de login e só pode visualizar.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/events-tickets.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - events-tickets-network

networks:
  events-tickets-network:
    name: events-tickets-network
    driver: bridge

volumes:
  events_pgdata:
  tickets_pgdata:
  logs_pgdata:
  prometheus_data:
  rabbitmq_data:
