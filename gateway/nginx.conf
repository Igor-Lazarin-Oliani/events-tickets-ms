worker_processes auto;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # DNS interno do Docker. Com ele, o gateway reencontra um serviço reiniciado com outro IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Mantém o identificador recebido ou gera um novo para rastrear a requisição.
    map $http_x_correlation_id $correlation_id {
        ""      $request_id;
        default $http_x_correlation_id;
    }

    # O painel do Grafana atualiza dados por WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Registra $uri, e não a query string, para não expor e-mails usados em filtros.
    log_format gateway escape=json
        '[GATEWAY] {"service":"api-gateway",'
        '"correlation_id":"$correlation_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr",'
        '"duration_s":$request_time}';

    access_log /dev/stdout gateway;

    server {
        listen 80;

        # Em variáveis, os nomes são resolvidos por requisição, e não só na subida do NGINX.
        set $events_service http://events-service:8000;
        set $tickets_service http://tickets-service:3000;
        set $prometheus http://prometheus:9090;
        set $grafana http://grafana:3000;

        default_type application/json;

        # Redirecionamentos relativos preservam a porta 8080, publicada no host.
        absolute_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;

        error_page 502 504 =503 @unavailable;

        location @unavailable {
            return 503 '{"message":"Service unavailable"}';
        }

        location = /gateway/health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # Lista de rotas permitidas: reserve-spot e release-spot são internas e ficam de fora.
        location = /events {
            proxy_pass $events_service;
        }

        location ~ ^/events/[^/]+$ {
            proxy_pass $events_service;
        }

        location = /tickets {
            proxy_pass $tickets_service;
        }

        location ~ ^/tickets/[^/]+$ {
            proxy_pass $tickets_service;
        }

        location ^~ /docs/events {
            proxy_pass $events_service;
        }

        location ^~ /docs/tickets {
            proxy_pass $tickets_service;
        }

        location = /health/events {
            access_log off;
            rewrite ^ /health break;
            proxy_pass $events_service;
        }

        location = /health/tickets {
            access_log off;
            rewrite ^ /health break;
            proxy_pass $tickets_service;
        }

        location = /metrics/events {
            access_log off;
            rewrite ^ /metrics break;
            proxy_pass $events_service;
        }

        location = /metrics/tickets {
            access_log off;
            rewrite ^ /metrics break;
            proxy_pass $tickets_service;
        }

        # O registro de acesso fica desligado porque os painéis consultam a cada poucos segundos.
        location = /prometheus {
            return 301 /prometheus/;
        }

        location ^~ /prometheus/ {
            access_log off;
            proxy_pass $prometheus;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location ^~ /grafana/ {
            access_log off;
            proxy_pass $grafana;
        }

        location / {
            return 404 '{"message":"Route not found"}';
        }
    }
}
