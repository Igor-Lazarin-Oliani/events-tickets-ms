global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: events-tickets-service
    metrics_path: /metrics
    static_configs:
      - targets: ["events-tickets-service:3000"]

  - job_name: logs-service
    metrics_path: /metrics
    static_configs:
      - targets: ["logs-service:8000"]
