global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: events-service
    metrics_path: /metrics
    static_configs:
      - targets: ["events-service:3001"]

  - job_name: tickets-service
    metrics_path: /metrics
    static_configs:
      - targets: ["tickets-service:3002"]

  - job_name: logs-service
    metrics_path: /metrics
    static_configs:
      - targets: ["logs-service:8000"]
